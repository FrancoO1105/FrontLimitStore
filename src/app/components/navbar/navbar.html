<!-- ======= Header ======= -->
<header id="header" class="header fixed-top d-flex align-items-center">

  <div class="d-flex align-items-center justify-content-between">
    <a href="index.html" class="logo d-flex align-items-center">
      <img src="assets/assets/img/logo.png" alt="">
      <span class="d-none d-lg-block">Sistema Ventas</span>
    </a>
    <i class="bi bi-list toggle-sidebar-btn" (click)="toggleSidebar($event)"></i>
  </div><!-- End Logo -->


  <nav class="header-nav ms-auto">
    <ul class="d-flex align-items-center">
      <li class="nav-item dropdown pe-3">
        <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
          <img src="assets/assets/img/profile-img.jpg" alt="Profile" class="rounded-circle">
          <span
              class="dropdown-toggle ps-2 text-truncate"
              style="max-width: 180px;"
              [title]="nombreUsuario"
            >
              {{ nombreUsuario }}
            </span>
        </a>

        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
          <!-- ... tu contenido tal cual ... -->

          <li>
            <a class="dropdown-item d-flex align-items-center" href="#" (click)="logout($event)">
              <i class="bi bi-box-arrow-right"></i>
              <span>Sign Out</span>
            </a>
          </li>
        </ul>
      </li><!-- End Profile Nav -->

    </ul>
  </nav><!-- End Icons Navigation -->

</header><!-- End Header -->
